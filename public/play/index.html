<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>العجلة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;700&family=Poppins:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play/play.css" />
</head>
<body>

<div id="game-root" class="game-root">

  <!-- طبقة الشعارات المتحركة -->
  <div id="logos-layer" class="logos-layer"></div>

  <!-- زرار اللغة -->
  <button id="lang-toggle-btn" class="lang-toggle-btn" hidden>EN</button>

  <!-- ===== شاشة التحميل ===== -->
  <div id="screen-loading" class="screen center-col">
    <div class="spinner-loader"></div>
  </div>

  <!-- ===== شاشة الخطأ ===== -->
  <div id="screen-error" class="screen center-col" hidden>
    <div class="error-box">
      <div style="font-size:40px">⚠️</div>
      <p id="error-message"></p>
    </div>
  </div>

  <!-- ===== شاشة المقدمة ===== -->
  <div id="screen-intro" class="screen" hidden>
    <div class="media-bg" id="intro-media-bg"></div>
    <div class="overlay" id="intro-overlay"></div>
    <div class="intro-content center-col">
      <h1 id="intro-title"></h1>
      <p id="intro-subtitle"></p>
      <button id="btn-start" class="btn-main"></button>
    </div>
  </div>

  <!-- ===== شاشة الفورم ===== -->
  <div id="screen-form" class="screen" hidden>
    <div class="scroll-panel center-col">
      <h2 id="form-title"></h2>
      <p id="form-subtitle" class="form-subtitle"></p>
      <form id="lead-form" class="lead-form">
        <div class="form-field" data-field="name">
          <label id="label-name"></label>
          <input type="text" id="input-name" />
        </div>
        <div class="form-field" data-field="phone">
          <label id="label-phone"></label>
          <input type="tel" id="input-phone" />
        </div>
        <div class="form-field" data-field="position">
          <label id="label-position"></label>
          <input type="text" id="input-position" />
        </div>
        <div class="form-field" data-field="email">
          <label id="label-email"></label>
          <input type="email" id="input-email" />
        </div>
        <div class="form-field" data-field="interests">
          <label id="label-interests"></label>
          <div class="multiselect" id="interests-select">
            <button type="button" class="multiselect-btn" id="interests-btn"></button>
            <div class="multiselect-panel" id="interests-panel" hidden></div>
          </div>
        </div>
        <div id="custom-fields-container"></div>
        <div id="form-error" class="form-error"></div>
        <button type="submit" id="btn-submit" class="btn-main"></button>
      </form>
    </div>
  </div>

  <!-- ===== شاشة العجلة ===== -->
  <div id="screen-wheel" class="screen" hidden>
    <div class="wheel-stage center-col">
      <div class="wheel-holder" id="wheel-holder">
        <div class="wheel-pointer" id="wheel-pointer">▼</div>
        <canvas id="game-wheel-canvas" width="800" height="800"></canvas>
        <div class="wheel-center-img" id="wheel-center-img" hidden></div>
      </div>
      <button id="btn-spin" class="btn-main btn-spin"></button>
    </div>
  </div>

  <!-- ===== بوب أب النتيجة ===== -->
  <div id="result-overlay" class="result-overlay" hidden>
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
    <div class="result-card" id="result-card">
      <img id="result-image" class="result-image" hidden />
      <h2 id="result-title"></h2>
      <div id="result-name" class="result-name"></div>
      <p id="result-subtitle"></p>
      <div id="result-prize" class="result-prize"></div>
      <button id="btn-result-close" class="btn-main"></button>
    </div>
  </div>

</div>

<script src="/play/sound.js"></script>
<script src="/play/play.js"></script>
</body>
</html>
